events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Docker 내부 DNS resolver
    resolver 127.0.0.11 valid=30s ipv6=off;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    server {
        listen 80;
        server_name _;

        # API 라우팅 → FastAPI 백엔드
        location /api/ {
            set $backend_host backend;
            proxy_pass http://$backend_host:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # 헬스체크
        location /health {
            set $backend_host backend;
            proxy_pass http://$backend_host:8000/health;
            proxy_set_header Host $host;
        }

        # 다우오피스 콜백
        location /daou/callback {
            set $backend_host backend;
            proxy_pass http://$backend_host:8000/api/daou/callback;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # FastAPI Swagger 문서
        location /docs {
            set $backend_host backend;
            proxy_pass http://$backend_host:8000/docs;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            set $backend_host backend;
            proxy_pass http://$backend_host:8000/openapi.json;
        }

        # React 프론트엔드 (SPA)
        location / {
            set $frontend_host frontend;
            proxy_pass http://$frontend_host:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
