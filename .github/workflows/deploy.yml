name: ARM Platform CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ──────────────────────────────
  # 1. 테스트
  # ──────────────────────────────
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: arm_test
          POSTGRES_USER: arm_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://arm_user:test_password@localhost:5432/arm_test
          DAOU_CLIENT_ID: test_id
          DAOU_CLIENT_SECRET: test_secret
          OPENAI_API_KEY: test_key
          JWT_SECRET: test_jwt_secret
        run: |
          cd backend
          pytest app/tests/ -v --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()

  # ──────────────────────────────
  # 2. 프로덕션 배포 (main 브랜치만)
  # ──────────────────────────────
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to AWS Lightsail
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "🚀 ARM Platform 배포 시작: $(date)"

            # 저장소 업데이트
            cd /home/ubuntu/ARM
            git fetch origin main
            git reset --hard origin/main

            # 환경변수 복사
            cp /home/ubuntu/.env.prod .env

            # Docker 이미지 빌드 및 서비스 재시작
            docker-compose -f docker-compose.prod.yml build --no-cache backend frontend
            docker-compose -f docker-compose.prod.yml up -d --remove-orphans

            # 헬스체크
            sleep 15
            curl -f http://localhost:8000/health || (echo "❌ 헬스체크 실패" && exit 1)

            # 오래된 이미지 정리
            docker system prune -f

            echo "✅ ARM Platform 배포 완료: $(date)"

      - name: Notify on Success
        if: success()
        run: |
          echo "✅ 배포 성공: ${{ github.sha }}"

      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ 배포 실패: ${{ github.sha }}"
